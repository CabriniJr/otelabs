# Contexto: tail-based | Coletor: determinístico (100%)
# Ground truth do contexto tail-based — tail_sampling com uma única
# política "always_sample", pra manter a mesma família de processor dos
# outros dois coletores deste contexto (só muda a taxa-base).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  tail_sampling:
    decision_wait: 2s   # nossas traces são de 1 span só, decisão é quase imediata
    policies:
      - name: tudo
        type: always_sample
  batch: {}

exporters:
  file:
    path: /out/traces.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [file]
