# Contexto: head-based | Coletor: determinístico (100%)
# Ground truth do contexto head-based — mantém todo o tráfego.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  probabilistic_sampler:
    sampling_percentage: 100
  batch: {}

exporters:
  file:
    path: /out/traces.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [probabilistic_sampler, batch]
      exporters: [file]
